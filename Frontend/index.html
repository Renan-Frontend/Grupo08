    <script>
      (function () {
        var isGithubPagesHost =
          window.location.hostname === 'renan-frontend.github.io';
        if (isGithubPagesHost && window.location.pathname === '/') {
          window.location.replace('/Grupo08/');
        }
        // Aquece a API do Render enquanto o JS carrega (reduz tela branca no 1º acesso).
        try {
          fetch('https://grupo08.onrender.com/health', {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
          }).catch(function () {});
        } catch (e) {}
      })();
